<!doctype html><html lang="pt-br"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar Voz Local</title><style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem;background:#f5f7f8;color:#192d35}section{background:white;padding:1.2rem;border-radius:12px;margin:1rem 0}label{display:block;margin:.8rem 0}input,select,button{padding:.5rem;font:inherit}button{background:#185a57;color:white;border:0;border-radius:6px;cursor:pointer}.hint{color:#4f666a;font-size:.9rem}</style><h1>Configurar Voz Local</h1><p>Escolha o motor para o atalho <strong>Ctrl + Alt + S</strong>. As configurações ficam salvas neste computador.</p><label>Motor ativo <select id="engine"><option value="kokoro">Kokoro</option><option value="f5">F5-TTS pt-BR</option></select></label><section><h2>Kokoro</h2><label>Voz <select id="voice"><option value="pf_dora">Dora</option><option value="pm_alex">Alex</option><option value="pm_santa">Santa</option></select></label><label>Velocidade <input id="kspeed" type="number" min="0.7" max="1.3" step="0.05"></label></section><section><h2>F5-TTS pt-BR</h2><p class="hint">Usa a referência Cadu. Limite de 500 caracteres por leitura. O checkpoint tem licença não comercial.</p><label>Velocidade <input id="fspeed" type="number" min="0.7" max="1.3" step="0.05"></label><label>Passos de geração <input id="nfe" type="number" min="8" max="64" step="1"> <span class="hint">Mais passos podem aumentar o tempo.</span></label><label>Força de orientação <input id="cfg" type="number" min="0" max="5" step="0.1"></label><label>Ajuste de amostragem (sway) <input id="sway" type="number" min="-2" max="1" step="0.1"></label><label>Transição entre trechos em segundos <input id="fade" type="number" min="0" max="1" step="0.05"></label><label>Nível de referência (RMS) <input id="rms" type="number" min="0.01" max="0.5" step="0.01"></label><label>Semente (-1 = aleatória) <input id="seed" type="number" min="-1" max="2147483647" step="1"></label></section><button id="save">Salvar configurações</button> <span id="status" role="status"></span><script>
const $=id=>document.getElementById(id); async function load(){let r=await fetch('/config');if(!r.ok)throw Error('Não foi possível carregar');let s=await r.json();$('engine').value=s.engine;$('voice').value=s.kokoro.voice;$('kspeed').value=s.kokoro.speed;for(const [id,key] of Object.entries({fspeed:'speed',nfe:'nfe_step',cfg:'cfg_strength',sway:'sway_sampling_coef',fade:'cross_fade_duration',rms:'target_rms',seed:'seed'}))$(id).value=s.f5[key]}
$('save').onclick=async()=>{let body={engine:$('engine').value,kokoro:{voice:$('voice').value,speed:+$('kspeed').value},f5:{speed:+$('fspeed').value,nfe_step:+$('nfe').value,cfg_strength:+$('cfg').value,sway_sampling_coef:+$('sway').value,cross_fade_duration:+$('fade').value,target_rms:+$('rms').value,seed:+$('seed').value,reference:'cadu'}};try{let r=await fetch('/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('Confira os valores dos campos.');$('status').textContent='Salvo neste computador.'}catch(e){$('status').textContent=e.message}};load().catch(e=>$('status').textContent=e.message)
</script></html>
